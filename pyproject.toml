[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-project-os"
version = "0.4.0a1"
description = "Local-first organization operating system for AI engineering portfolios and Agent workforces."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{name = "Agent Project OS contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
test = ["build>=1.2,<2", "jsonschema>=4.18,<5"]

[project.scripts]
agent-project = "agent_project_os.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agent_project_os.templates" = ["**/*.md", "**/*.json", "**/*.yml", "**/*.js"]

[tool.setuptools.data-files]
"share/agent-project-os/schemas" = ["schemas/*.json"]
"share/doc/agent-project-os" = ["docs/*.md", "prompts/*.md"]
